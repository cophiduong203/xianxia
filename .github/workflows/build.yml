
name: Build Hytur Tu Tien 3.0

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Build Minecraft Fabric Mod
        run: gradle --no-daemon clean build

      - name: Upload Mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: HyturTuTien-3.0
          path: build/libs/*.jar
          if-no-files-found: error
